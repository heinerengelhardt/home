<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>—</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.9;
            font-weight: 300;
            letter-spacing: 0.03em;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10rem 2rem;
            min-height: 100vh;
        }
        
        .time {
            font-size: 0.7rem;
            color: #fff;
            margin-bottom: 10rem;
            font-weight: 300;
        }
        
        .mark {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 8rem;
            font-weight: 300;
        }
        
        .section {
            margin-bottom: 10rem;
        }
        
        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fff;
            margin-bottom: 3rem;
            font-weight: 300;
        }
        
        .content {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 2rem;
        }
        
        .list {
            list-style: none;
            font-size: 0.85rem;
            color: #fff;
        }
        
        .list li {
            margin-bottom: 1rem;
        }
        
        a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #fff;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: #fff;
            border-bottom-color: #fff;
        }
        
        .footer {
            margin-top: 15rem;
            padding-top: 4rem;
            border-top: 1px solid #fff;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            font-size: 0.75rem;
            margin-bottom: 3rem;
        }
        
        .footer-note {
            font-size: 0.65rem;
            color: #fff;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 6rem 1.5rem;
            }
            
            .time {
                margin-bottom: 6rem;
            }
            
            .mark {
                margin-bottom: 5rem;
            }
            
            .section {
                margin-bottom: 6rem;
            }
            
            .footer {
                margin-top: 10rem;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="time" id="time"></div>
        
        <div class="mark">—</div>
        
        <div class="section">
            <div class="section-title">Willkommen</div>
            <div class="content">
                Ein Äther für digitale Reflexion.<br>
                Minimale Komplexität, maximale Präzision.
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Bereiche</div>
            <ul class="list">
                <li>Home Assistant</li>
                <li>Digitale Konstruktionen</li>
                <li>Morphologien</li>
            </ul>
        </div>
        
        <div class="footer">
            <div class="footer-links">
                <a href="datenschutz.html">Datenschutz</a>
                <a href="impressum.html">Impressum</a>
            </div>
            <div class="footer-note">
                © 2026
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-GB', { 
                hour12: false, 
                timeZone: 'UTC',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateStr = now.toLocaleDateString('en-GB', { timeZone: 'UTC' });
            document.getElementById('time').textContent = `${dateStr} / ${timeStr} UTC`;
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
